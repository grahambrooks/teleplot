name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Debug info is most of target/'s size; tests don't need it.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # The server, WASM client and release builds together outgrow the
      # runner's free disk; drop toolchains Teleplot doesn't use (~20 GB).
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-leptos,cargo-deny

      - name: Pre-commit gate (fmt, clippy, test)
        run: make pre-commit

      - name: Supply-chain checks
        run: make deny

      - name: Release build serves the full UI from the binary alone
        run: make smoke

  # The fixture dashboards must reproduce Kibana's numbers on both versions.
  elasticsearch:
    runs-on: ubuntu-latest
    services:
      es8:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.22
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms1g -Xmx1g
        ports: ["9208:9200"]
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow"
          --health-interval 5s --health-retries 60
      es9:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms1g -Xmx1g
        ports: ["9209:9200"]
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow"
          --health-interval 5s --health-retries 60
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Seed both clusters with the fixture dataset
        run: |
          cargo run -q --example seed -- --es http://localhost:9208 --end 2026-10-01
          cargo run -q --example seed -- --es http://localhost:9209 --end 2026-10-01

      - name: Install Kibana Logs sample data
        run: |
          docker run --detach --rm --name teleplot-kibana9 \
            --add-host host.docker.internal:host-gateway \
            --publish 5601:5601 \
            --env ELASTICSEARCH_HOSTS=http://host.docker.internal:9209 \
            docker.elastic.co/kibana/kibana:9.5.3
          ready=0
          for _ in {1..36}; do
            if curl --connect-timeout 1 --max-time 3 -fsS http://localhost:5601/api/status |
              jq -e '.status.overall.level == "available"' >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs teleplot-kibana9
            exit 1
          fi
          curl --connect-timeout 5 --max-time 120 -sf -X POST \
            http://localhost:5601/api/sample_data/logs \
            -H 'kbn-xsrf: true' \
            -H 'x-elastic-internal-origin: kibana' >/dev/null

      - name: Stop Kibana
        if: always()
        run: docker stop teleplot-kibana9 || true

      - name: Kibana parity tests
        env:
          TELEPLOT_TEST_ES: 8.19=http://localhost:9208,9.5=http://localhost:9209
        run: cargo test --test elasticsearch --test mcp
