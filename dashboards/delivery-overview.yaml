# Teleplot's native Delivery Overview: DORA's five metrics with benchmark
# bands and change vs the previous period, distributions instead of
# averages, and team drill-down. Runs over the dataset written by
# `cargo run --example seed` (see fixtures/README.md).
#
# Benchmark bands are an editable overlay, not a DORA standard: DORA's 2025
# report dropped the elite/high/medium/low clusters. These follow the 2023
# DORA levels (as used by Apache DevLake) for lead time and recovery, DORA
# 2023 for change fail rate, and LinearB's 2026 p75 cycle-time benchmarks.
id: delivery-overview
title: Delivery Overview
description: DORA metrics, cycle time and investment for engineering leaders
time:
  from: now-90d/d
  to: now
min_samples: 5
controls:
  - id: group
    title: Group
    field: group
    data_view: { index: delivery-prs, time_field: merged_at }
  - id: team
    title: Team
    field: team
    data_view: { index: delivery-prs, time_field: merged_at }
  - id: repo
    title: Repo
    field: repo
    data_view: { index: delivery-prs, time_field: merged_at }
# Marked on every time-series chart, so a change in cycle time or lead time
# can be read against what happened in production. Both follow the team and
# repo controls.
annotations:
  - id: failed-deploys
    label: Failed deployments
    data_view: { index: delivery-deployments, time_field: deployed_at }
    query: { language: kql, text: "result : failure" }
    text: team
    color: "#F2495C"
  - id: incidents
    label: Major incidents (sev1, sev2)
    data_view: { index: delivery-incidents, time_field: created_at }
    query: { language: kql, text: "severity : (sev1 or sev2)" }
    end: resolved_at
    text: team
    color: "#B877D9"
panels:
  # ---------------------------------------------------------------- DORA tiles
  - id: deploy-frequency
    title: Deployment frequency
    description: "Production deployments per week over the selected range, excluding rework (unplanned fixes). The line is the weekly count; the bar tracks progress to the 50-a-week target."
    grid: { x: 0, y: 0, w: 10, h: 7 }
    content:
      type: chart
      kind: metric
      query: { language: kql, text: "is_rework : false" }
      layers:
        - id: deploys
          data_view: { index: delivery-deployments, time_field: deployed_at }
          # Shared metrics (dashboards/metrics.yaml): defined once, so every
          # panel and dashboard counts deployments the same way.
          columns:
            - { id: per-week, op: metric, name: deployment_frequency }
            - { id: per-week-prev, label: Previous period, op: metric, name: deployment_frequency, time_shift: previous }
            - { id: target, label: Target per week, op: static_value, value: 50 }
          # A bar towards the target of 50 a week.
          encoding: { as: metric, value: per-week, secondary: per-week-prev, max: target, progress: true }
        # The background trend: deployments each week.
        - id: weekly
          data_view: { index: delivery-deployments, time_field: deployed_at }
          columns:
            - { id: week, op: date_histogram, field: deployed_at, interval: 1w }
            - { id: n, op: count }
          encoding: { as: sparkline, x: week, y: n }

  - id: lead-time
    title: Change lead time
    description: "Median hours from commit to running in production, over planned deployments. DORA bands: elite under a day, high under a week, medium under a month."
    grid: { x: 10, y: 0, w: 10, h: 7 }
    content:
      type: chart
      kind: metric
      query: { language: kql, text: "is_rework : false" }
      layers:
        - id: lead
          data_view: { index: delivery-deployments, time_field: deployed_at }
          columns:
            - { id: median, label: "Median, hours", op: metric, name: change_lead_time }
            - { id: median-prev, label: Change on previous period, op: metric, name: change_lead_time, time_shift: previous }
          # A trend badge: lower lead time is better, so a fall is green.
          encoding: { as: metric, value: median, secondary: median-prev, badge: { better: down } }
        - id: weekly
          data_view: { index: delivery-deployments, time_field: deployed_at }
          columns:
            - { id: week, op: date_histogram, field: deployed_at, interval: 1w }
            - { id: median, op: metric, name: change_lead_time }
          encoding: { as: sparkline, x: week, y: median }

  - id: change-fail-rate
    title: Change fail rate
    description: "Share of planned deployments that failed in production. DORA bands: elite under 5%, high under 10%, medium under 15%."
    grid: { x: 20, y: 0, w: 10, h: 7 }
    content:
      type: chart
      kind: metric
      query: { language: kql, text: "is_rework : false" }
      layers:
        - id: cfr
          data_view: { index: delivery-deployments, time_field: deployed_at }
          columns:
            - { id: rate, label: Failed deployments, op: metric, name: change_fail_rate }
            - { id: rate-prev, label: Previous period, op: metric, name: change_fail_rate, time_shift: previous }
          encoding: { as: metric, value: rate, secondary: rate-prev }

  - id: recovery
    title: Failed deployment recovery
    description: "Median hours to recover from incidents that a deployment caused. DORA bands: elite under an hour, high under a day, medium under a week."
    grid: { x: 30, y: 0, w: 9, h: 7 }
    content:
      type: chart
      kind: metric
      query: { language: kql, text: "caused_by_deployment_id : *" }
      layers:
        - id: recovery
          data_view: { index: delivery-incidents, time_field: created_at }
          columns:
            - { id: median, label: "Median, hours", op: metric, name: recovery_time }
            - { id: median-prev, label: Previous period, op: metric, name: recovery_time, time_shift: previous }
          encoding: { as: metric, value: median, secondary: median-prev }

  - id: rework
    title: Deployment rework rate
    description: "Share of deployments that were unplanned, made to fix a problem in production. A rising rate often follows a rising change fail rate."
    grid: { x: 39, y: 0, w: 9, h: 7 }
    content:
      type: chart
      kind: metric
      layers:
        - id: rework
          data_view: { index: delivery-deployments, time_field: deployed_at }
          columns:
            - { id: rate, op: metric, name: rework_rate }
            - { id: rate-prev, label: Previous period, op: metric, name: rework_rate, time_shift: previous }
          encoding: { as: metric, value: rate, secondary: rate-prev }

  # ---------------------------------------------------------------- distributions
  - id: lead-time-band
    title: Change lead time, weekly median and middle 50%
    grid: { x: 0, y: 7, w: 24, h: 13 }
    content:
      type: chart
      kind: xy
      query: { language: kql, text: "is_rework : false" }
      layers:
        - id: band
          data_view: { index: delivery-deployments, time_field: deployed_at }
          columns:
            - { id: week, op: date_histogram, field: deployed_at, interval: 1w, include_empty: true }
            - { id: p25, label: 25th percentile, op: percentile, field: change_lead_time_hours, percent: 25.0, format: { kind: number, decimals: 1, suffix: " h" } }
            - { id: p50, label: Median, op: metric, name: change_lead_time }
            - { id: p75, label: 75th percentile, op: percentile, field: change_lead_time_hours, percent: 75.0, format: { kind: number, decimals: 1, suffix: " h" } }
          encoding: { as: band, x: week, low: p25, mid: p50, high: p75 }

  - id: cycle-scatter
    title: PR cycle time, each merged PR and the rolling median
    grid: { x: 24, y: 7, w: 24, h: 13 }
    content:
      type: chart
      kind: xy
      query: { language: kql, text: "cycle_time_hours : *" }
      layers:
        - id: prs
          data_view: { index: delivery-prs, time_field: merged_at }
          documents: { limit: 3000, sort: merged_at }
          columns:
            - { id: merged, label: Merged, op: value, field: merged_at }
            - id: hours
              label: Cycle time
              op: value
              field: cycle_time_hours
              format: { kind: number, decimals: 1, suffix: " h" }
              thresholds:
                - { label: Elite, to: 25, color: "#73BF69" }
                - { label: Good, from: 25, to: 73, color: "#5794F2" }
                - { label: Fair, from: 73, to: 161, color: "#FF9830" }
                - { label: Needs focus, from: 161, color: "#F2495C" }
            - { id: trend, label: Rolling median (50 PRs), op: rolling_median, of: hours, window: 50, format: { kind: number, decimals: 1, suffix: " h" } }
          # Service-level expectations: the cycle time half, 85% and 95% of
          # these PRs stayed within.
          encoding: { as: scatter, x: merged, y: hours, trend: trend, log_scale: true, percentiles: [50, 85, 95] }

  # Log-spaced buckets keep the long tail readable, and the percentile lines
  # say what a team can commit to ("85% of PRs merge within …").
  - id: cycle-distribution
    title: PR cycle time distribution, with service-level expectations
    description: "How long merged PRs took from first commit to production, on a log scale. p85 is a service-level expectation: 85% of PRs finish within it."
    grid: { x: 0, y: 20, w: 24, h: 12 }
    content:
      type: chart
      kind: xy
      layers:
        - id: prs
          data_view: { index: delivery-prs, time_field: merged_at }
          columns:
            - { id: hours, label: Cycle time, op: log_histogram, field: cycle_time_hours, min: 2, max: 2000, format: { kind: number, suffix: " h" } }
            - { id: n, label: Merged PRs, op: count }
          encoding: { as: xy, series: bar, x: hours, y: [n] }
        - id: sle
          data_view: { index: delivery-prs, time_field: merged_at }
          columns:
            - { id: p50, label: p50, op: percentile, field: cycle_time_hours, percent: 50.0, format: { kind: number, decimals: 1, suffix: " h" } }
            - { id: p85, label: p85, op: percentile, field: cycle_time_hours, percent: 85.0, format: { kind: number, decimals: 1, suffix: " h" } }
            - { id: p95, label: p95, op: percentile, field: cycle_time_hours, percent: 95.0, format: { kind: number, decimals: 1, suffix: " h" } }
          encoding:
            as: reference_lines
            lines:
              - { column: p50, axis: bottom, style: dashed, color: "#73BF69" }
              - { column: p85, axis: bottom, style: dashed, color: "#FF9830" }
              - { column: p95, axis: bottom, style: dashed, color: "#F2495C" }

  # The same buckets week by week: a shifting distribution shows here
  # before it moves the median.
  - id: cycle-heatmap
    title: PR cycle time by week
    grid: { x: 24, y: 20, w: 24, h: 12 }
    content:
      type: chart
      kind: heatmap
      layers:
        - id: prs
          data_view: { index: delivery-prs, time_field: merged_at }
          columns:
            - { id: week, op: date_histogram, field: merged_at, interval: 1w }
            - { id: hours, label: Cycle time, op: log_histogram, field: cycle_time_hours, min: 2, max: 2000, format: { kind: number, suffix: " h" } }
            - { id: n, label: Merged PRs, op: count }
          encoding: { as: heatmap, x: week, y: hours, value: n }

  # ---------------------------------------------------------------- throughput and investment
  - id: throughput
    title: Merged PRs per week, and the AI-assisted share
    grid: { x: 0, y: 32, w: 24, h: 12 }
    content:
      type: chart
      kind: xy
      layers:
        - id: merged
          data_view: { index: delivery-prs, time_field: merged_at }
          columns:
            - { id: week, op: date_histogram, field: merged_at, interval: 1w, include_empty: true }
            - { id: merged, label: Merged PRs, op: count }
          encoding: { as: xy, series: bar, x: week, y: [merged] }
        - id: ai
          data_view: { index: delivery-prs, time_field: merged_at }
          columns:
            - { id: week, op: date_histogram, field: merged_at, interval: 1w, include_empty: true }
            - { id: ai, op: count, filter: { language: kql, text: "ai_assisted : true" }, helper: true }
            - { id: all, op: count, helper: true }
            - id: ai-share
              label: AI-assisted
              op: formula
              text: "count(kql='ai_assisted : true') / count()"
              expr: { call: divide, args: [ai, all] }
              format: { kind: percent, decimals: 0 }
          encoding: { as: xy, series: line, x: week, y: [ai-share] }

  - id: investment
    title: Investment allocation (story points, by type of work)
    description: "Where effort went, by story points on completed work. Feature against defect, debt and risk work."
    grid: { x: 24, y: 32, w: 24, h: 12 }
    content:
      type: chart
      kind: xy
      query: { language: kql, text: "status : done" }
      layers:
        - id: work
          data_view: { index: delivery-workitems, time_field: done_at }
          columns:
            - { id: type, op: terms, fields: [type], size: 4, order: { by: column, column: points } }
            - { id: month, op: date_histogram, field: done_at, interval: 1M, include_empty: true }
            - { id: points, label: Story points, op: sum, field: story_points }
          encoding: { as: xy, series: bar_percentage_stacked, x: month, y: [points], split: type }

  # ---------------------------------------------------------------- teams
  - id: teams
    title: DORA by team (click a team to focus the dashboard on it)
    grid: { x: 0, y: 44, w: 48, h: 14 }
    content:
      type: chart
      kind: table
      query: { language: kql, text: "is_rework : false" }
      layers:
        - id: teams
          data_view: { index: delivery-deployments, time_field: deployed_at }
          columns:
            - { id: team, label: Team, op: terms, fields: [team], size: 25, order: { by: column, column: n } }
            - { id: n, op: metric, name: deployments }
            - { id: per-week, label: Per week, op: metric, name: deployment_frequency }
            - { id: lead, op: metric, name: change_lead_time }
            - { id: cfr, op: metric, name: change_fail_rate }
          encoding:
            as: table
            columns: [team, n, per-week, lead, cfr]
            styles:
              - { column: n, summary: sum, summary_label: Total }
              - column: lead
                summary: avg
                # Coloured by the same bands as the lead-time tile.
                color:
                  mode: cell
                  stops:
                    - { from: 0, color: "#73BF69" }
                    - { from: 24, color: "#5794F2" }
                    - { from: 168, color: "#FF9830" }
                    - { from: 720, color: "#F2495C" }
              - column: cfr
                color:
                  mode: text
                  stops:
                    - { from: 0, color: "#73BF69" }
                    - { from: 0.10, color: "#FF9830" }
                    - { from: 0.15, color: "#F2495C" }
            sparkline: { layer: weekly, label: Deployments per week }
        # Each team's deployments per week, for the sparkline column.
        - id: weekly
          data_view: { index: delivery-deployments, time_field: deployed_at }
          columns:
            - { id: team, op: terms, fields: [team], size: 25 }
            - { id: week, op: date_histogram, field: deployed_at, interval: 1w }
            - { id: n, op: count }
          encoding: { as: sparkline, x: week, y: n, by: team }

  # ---------------------------------------------------------------- ES|QL
  # A comparison the query DSL can't express in one search: each team's
  # median cycle time for AI-assisted PRs against the rest, and the change.
  - id: ai-cycle
    title: Does AI assistance shorten cycle time? (ES|QL, by team)
    description: "Median cycle time of AI-assisted PRs against the rest, per team. This is a correlation, not a cause: teams may use AI on different kinds of work."
    grid: { x: 0, y: 58, w: 48, h: 12 }
    content:
      type: chart
      kind: table
      layers:
        - id: ai
          data_view: { index: delivery-prs, time_field: merged_at }
          esql:
            query: |
              FROM delivery-prs
              | WHERE cycle_time_hours IS NOT NULL
              | STATS ai = MEDIAN(CASE(ai_assisted, cycle_time_hours)),
                      other = MEDIAN(CASE(NOT ai_assisted, cycle_time_hours)),
                      prs = COUNT(*) BY team
              | EVAL change = ai / other - 1
              | SORT change
          columns:
            - { id: team, label: Team, op: value, field: team }
            - { id: prs, label: Merged PRs, op: value, field: prs }
            - { id: ai, label: "Median, AI-assisted", op: value, field: ai, format: { kind: number, decimals: 1, suffix: " h" } }
            - { id: other, label: "Median, other PRs", op: value, field: other, format: { kind: number, decimals: 1, suffix: " h" } }
            - { id: change, label: Change, op: value, field: change, format: { kind: percent, decimals: 0 } }
          encoding: { as: table, columns: [team, prs, ai, other, change] }

  # ---------------------------------------------------------------- cadence and shares
  # Deploy cadence: one square a day, darker for more deployments. Weekends,
  # freezes and busy weeks stand out.
  - id: deploy-calendar
    title: Deployments per day
    grid: { x: 0, y: 70, w: 24, h: 10 }
    content:
      type: chart
      kind: calendar
      layers:
        - id: days
          data_view: { index: delivery-deployments, time_field: deployed_at }
          columns:
            - { id: day, op: date_histogram, field: deployed_at, interval: 1d, include_empty: true }
            - { id: n, label: deployments, op: count }
          encoding: { as: calendar, date: day, value: n }

  - id: cfr-gauge
    title: Change fail rate against the DORA bands
    description: "Change fail rate over the selected range, against the DORA bands. The tick marks the 5% elite threshold."
    grid: { x: 24, y: 70, w: 12, h: 10 }
    content:
      type: chart
      kind: gauge
      query: { language: kql, text: "is_rework : false" }
      layers:
        - id: cfr
          data_view: { index: delivery-deployments, time_field: deployed_at }
          columns:
            - { id: rate, label: Failed deployments, op: metric, name: change_fail_rate }
            - { id: max, op: static_value, value: 0.3 }
            - { id: goal, op: static_value, value: 0.05 }
          encoding:
            as: gauge
            value: rate
            max: max
            goal: goal
            shape: arc
            bands:
              stops:
                - { from: 0, color: "#73BF69" }
                - { from: 0.05, color: "#5794F2" }
                - { from: 0.10, color: "#FF9830" }
                - { from: 0.15, color: "#F2495C" }

  - id: results-waffle
    title: Deployments by result
    grid: { x: 36, y: 70, w: 12, h: 10 }
    content:
      type: chart
      kind: waffle
      layers:
        - id: results
          data_view: { index: delivery-deployments, time_field: deployed_at }
          columns:
            - { id: result, op: terms, fields: [result], size: 5 }
            - { id: n, label: Deployments, op: count }
          encoding: { as: pie, groups: [result], values: [n] }

  # Small multiples: each team's weekly median on the same scale, so a team
  # that is slow, or getting slower, is plain at a glance.
  - id: team-multiples
    title: Weekly median cycle time, team by team
    description: "Weekly median PR cycle time for each team, all on the same scale. Weeks with too few PRs are shaded."
    grid: { x: 0, y: 80, w: 48, h: 16 }
    content:
      type: chart
      kind: xy
      layers:
        - id: weekly
          data_view: { index: delivery-prs, time_field: merged_at }
          columns:
            - { id: team, op: terms, fields: [team], size: 8 }
            - { id: week, op: date_histogram, field: merged_at, interval: 1w }
            - { id: median, op: metric, name: cycle_time }
          encoding:
            as: xy
            series: line
            x: week
            y: [median]
            facet: team
            interpolation: smooth
            missing: gap
            legend_stats: [average, last]

  - id: investment-treemap
    title: Story points by type of work and team
    grid: { x: 0, y: 96, w: 24, h: 12 }
    content:
      type: chart
      kind: treemap
      query: { language: kql, text: "status : done" }
      layers:
        - id: work
          data_view: { index: delivery-workitems, time_field: done_at }
          columns:
            - { id: type, op: terms, fields: [type], size: 4 }
            - { id: team, op: terms, fields: [team], size: 8 }
            - { id: points, label: Story points, op: sum, field: story_points }
          encoding: { as: pie, groups: [type, team], values: [points] }

  # Where the time goes: each team's average hours in each phase of a PR.
  # Averages, not medians, so the phases add up to the whole bar.
  - id: cycle-phases
    title: Where PR cycle time goes, by team
    description: "Average hours a merged PR spent in each phase, per team: coding, waiting for a first review (pickup), review, and deploying. Averages, not medians, so the phases add up to the whole bar."
    grid: { x: 24, y: 96, w: 24, h: 12 }
    content:
      type: chart
      kind: xy
      query: { language: kql, text: "cycle_time_hours : *" }
      layers:
        - id: phases
          data_view: { index: delivery-prs, time_field: merged_at }
          columns:
            - { id: team, label: Team, op: terms, fields: [team], size: 8, order: { by: column, column: total } }
            - { id: total, op: average, field: cycle_time_hours, helper: true }
            - { id: coding, label: Coding, op: average, field: coding_hours, format: { kind: number, decimals: 1, suffix: " h" } }
            - { id: pickup, label: Pickup, op: average, field: pickup_hours, format: { kind: number, decimals: 1, suffix: " h" } }
            - { id: review, label: Review, op: average, field: review_hours, format: { kind: number, decimals: 1, suffix: " h" } }
            - { id: deploy, label: Deploy, op: average, field: deploy_hours, format: { kind: number, decimals: 1, suffix: " h" } }
          encoding: { as: xy, series: bar_horizontal_stacked, x: team, y: [coding, pickup, review, deploy] }

  # ---------------------------------------------------------------- comparing teams
  # Each team's distribution side by side: every PR as a dot (a beeswarm),
  # over a box of its middle half with whiskers to p5 and p95. A box over a
  # handful of PRs looks as solid as one over hundreds; the dots and the
  # count show which is which. Grouped by team, never by person.
  - id: cycle-by-team
    title: PR cycle time by team, every PR and the middle half
    description: "Each dot is a merged PR; the box is the team's middle half (25th to 75th percentile), the thick line its median, and the whiskers p5 and p95. Boxes over fewer than 5 PRs are dashed. The dashed line is p85 across all teams. Log scale."
    grid: { x: 0, y: 108, w: 48, h: 16 }
    content:
      type: chart
      kind: box_plot
      query: { language: kql, text: "cycle_time_hours : *" }
      layers:
        - id: boxes
          data_view: { index: delivery-prs, time_field: merged_at }
          columns:
            - { id: team, label: Team, op: terms, fields: [team], size: 8, order: { by: column, column: p50 } }
            - { id: p5, label: 5th percentile, op: percentile, field: cycle_time_hours, percent: 5.0 }
            - { id: p25, label: 25th percentile, op: percentile, field: cycle_time_hours, percent: 25.0 }
            - { id: p50, op: metric, name: cycle_time }
            - { id: p75, label: 75th percentile, op: percentile, field: cycle_time_hours, percent: 75.0 }
            - { id: p95, label: 95th percentile, op: percentile, field: cycle_time_hours, percent: 95.0 }
            - { id: n, label: Merged PRs, op: count }
          encoding: { as: box, group: team, low: p5, q1: p25, median: p50, q3: p75, high: p95, count: n, log_scale: true }
        - id: prs
          data_view: { index: delivery-prs, time_field: merged_at }
          documents: { limit: 3000, sort: merged_at }
          columns:
            - { id: team, label: Team, op: value, field: team }
            - { id: hours, label: Cycle time, op: value, field: cycle_time_hours, format: { kind: number, decimals: 1, suffix: " h" } }
            - { id: ai, label: AI-assisted, op: value, field: ai_assisted }
          encoding:
            as: swarm
            group: team
            value: hours
            color: ai
            log_scale: true
            series_styles:
              "true": { label: AI-assisted }
              "false": { label: Other PRs, color: neutral }
        - id: sle
          data_view: { index: delivery-prs, time_field: merged_at }
          columns:
            - { id: p85, label: p85 (all teams), op: percentile, field: cycle_time_hours, percent: 85.0, format: { kind: number, decimals: 1, suffix: " h" } }
          encoding:
            as: reference_lines
            lines:
              - { column: p85, axis: bottom, style: dashed, color: "#FF9830" }

  # Incidents as a state timeline: when each team had one open, and how
  # bad. Overlapping incidents get their own lane, so none hides another.
  - id: incident-timeline
    title: Incidents by team, opened to resolved
    description: "Each bar is an incident, from when it was opened to when it was resolved, coloured by severity. Incidents still open run to now, faded. Incidents at the same time stack in the team's row."
    grid: { x: 0, y: 124, w: 48, h: 12 }
    content:
      type: chart
      kind: state_timeline
      layers:
        - id: incidents
          data_view: { index: delivery-incidents, time_field: created_at }
          documents: { limit: 500, sort: created_at }
          columns:
            - { id: team, label: Team, op: value, field: team }
            - { id: opened, label: Opened, op: value, field: created_at }
            - { id: resolved, label: Resolved, op: value, field: resolved_at }
            - { id: severity, label: Severity, op: value, field: severity }
            - { id: repo, label: Repo, op: value, field: repo }
          encoding:
            as: states
            row: team
            start: opened
            end: resolved
            state: severity
            text: repo
            series_styles:
              sev1: { color: critical }
              sev2: { color: serious }
              sev3: { color: warning }
