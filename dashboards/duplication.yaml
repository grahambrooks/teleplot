# Code duplication across the estate, from mimeo (software-analytics roadmap
# Phase 2). The data path is mimeo -> insight-collect -> insight -> teleplot:
# every layer queries insight's series API, not Elasticsearch, so this
# dashboard needs `insight: { url }` in teleplot.yaml and no Elasticsearch.
#
# mimeo records a value only when it changes, and dates it by the commit that
# changed it. `latest_by` carries each repo's (or the estate's) latest value
# into weeks where nothing changed, so a line doesn't drop to nothing between
# changes.
id: duplication
title: Duplication
description: Copy-paste across the estate and by team, from mimeo via insight
time:
  from: now-90d/d
  to: now
panels:
  - id: estate
    title: Estate duplication
    description: "Share of significant lines that are duplicated anywhere in the estate, at the end of each week."
    grid: { x: 0, y: 0, w: 24, h: 10 }
    content:
      type: chart
      kind: xy
      layers:
        - id: estate
          data_view: { index: duplication_estate, time_field: changed_at }
          insight:
            interval: 1w
            latest_by: fleet_index
            columns:
              - { id: pct, op: last_value, field: duplicate_percentage }
          columns:
            - { id: week, label: Week, op: value, field: t }
            - { id: pct, label: Duplicated, op: value, field: pct, format: { kind: number, decimals: 1, suffix: "%" } }
          encoding: { as: xy, series: line, x: week, y: [pct] }

  - id: by-team
    title: Duplication by team
    description: "Duplicated lines as a share of significant lines, over each repo's latest measurement, grouped by owning team. Repos in a personal account belong to personal:<login>."
    grid: { x: 24, y: 0, w: 24, h: 10 }
    content:
      type: chart
      kind: xy
      layers:
        - id: teams
          data_view: { index: duplication_repo, time_field: changed_at }
          insight:
            interval: 1w
            latest_by: repo
            group_by: [{ field: team, size: 10 }]
            columns:
              - { id: dup, op: sum, field: duplicate_lines }
              - { id: sig, op: sum, field: significant_lines }
          columns:
            - { id: week, label: Week, op: value, field: t }
            - { id: team, label: Team, op: value, field: team }
            - { id: dup, op: value, field: dup, helper: true }
            - { id: sig, op: value, field: sig, helper: true }
            - id: ratio
              label: Duplicated
              op: formula
              text: "sum(duplicate_lines) / sum(significant_lines)"
              expr: { call: divide, args: [dup, sig] }
              format: { kind: percent, decimals: 1 }
          encoding: { as: xy, series: line, x: week, y: [ratio], split: team }

  - id: clusters
    title: Cross-repo duplicate sets, appeared and resolved
    description: "Duplicate sets that span more than one repository, by the week of the commit that created or removed them."
    grid: { x: 0, y: 10, w: 48, h: 9 }
    content:
      type: chart
      kind: xy
      layers:
        - id: events
          data_view: { index: duplication_cluster, time_field: changed_at }
          insight:
            interval: 1w
            filters:
              - { field: cross_repo, op: eq, value: true }
              - { field: event, op: in, values: [appeared, resolved] }
            group_by: [{ field: event }]
            columns:
              - { id: n, op: count }
          columns:
            - { id: week, label: Week, op: value, field: t }
            - { id: event, label: Event, op: value, field: event }
            - { id: n, label: Sets, op: value, field: n }
          encoding: { as: xy, series: bar, x: week, y: [n], split: event }

  - id: worst
    title: Repositories by duplication
    description: "Each repository's latest measurement in the time range."
    grid: { x: 0, y: 19, w: 48, h: 8 }
    content:
      type: chart
      kind: table
      layers:
        - id: repos
          data_view: { index: duplication_repo, time_field: changed_at }
          insight:
            latest_by: repo
            group_by: [{ field: repo }, { field: team }]
            columns:
              - { id: pct, op: last_value, field: duplicate_percentage }
              - { id: dup, op: last_value, field: duplicate_lines }
              - { id: cross, op: last_value, field: cross_repo_duplicate_lines }
          columns:
            - { id: repo, label: Repository, op: value, field: repo, shorten: true }
            - { id: team, label: Team, op: value, field: team }
            - { id: pct, label: Duplicated, op: value, field: pct, format: { kind: number, decimals: 1, suffix: "%" } }
            - { id: dup, label: Duplicated lines, op: value, field: dup }
            - { id: cross, label: Shared with other repos, op: value, field: cross }
          encoding: { as: table, columns: [repo, team, pct, dup, cross] }
