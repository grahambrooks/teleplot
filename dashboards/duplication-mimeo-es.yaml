# The duplication dashboard over mimeo's own Elasticsearch export
# (`mimeo fleet push`, data stream mimeo-fleet), for deployments without
# insight. Panels mirror the software-analytics duplication dashboard
# (its dashboards/duplication.yaml), except duplication by team: ownership is
# stamped by insight and isn't in mimeo's events.
#
# Unlike the insight version, a week with no mimeo event is empty here:
# Elasticsearch's last value doesn't carry forward between buckets.
id: duplication-mimeo-es
title: Duplication (mimeo export, Elasticsearch)
description: Copy-paste across the estate, from mimeo's native events in Elasticsearch
time:
  from: now-90d/d
  to: now
panels:
  - id: estate
    title: Estate duplication
    grid: { x: 0, y: 0, w: 24, h: 10 }
    content:
      type: chart
      kind: xy
      query: { language: kql, text: 'mimeo.kind : "estate"' }
      layers:
        - id: estate
          data_view: { index: mimeo-fleet, time_field: "@timestamp" }
          columns:
            - { id: week, label: Week, op: date_histogram, field: "@timestamp", interval: 1w }
            - { id: pct, label: Duplicated, op: last_value, field: estate.duplicatePercentage, sort_field: "@timestamp", format: { kind: number, decimals: 1, suffix: "%" } }
          encoding: { as: xy, series: line, x: week, y: [pct] }

  - id: clusters
    title: Cross-repo duplicate sets, appeared and resolved
    grid: { x: 0, y: 10, w: 24, h: 10 }
    content:
      type: chart
      kind: xy
      query: { language: kql, text: 'mimeo.kind : "cluster" and cluster.crossRepo : true and cluster.event : ("appeared" or "resolved")' }
      layers:
        - id: events
          data_view: { index: mimeo-fleet, time_field: "@timestamp" }
          columns:
            - { id: week, label: Week, op: date_histogram, field: "@timestamp", interval: 1w }
            - { id: event, label: Event, op: terms, fields: [cluster.event], size: 5 }
            - { id: n, label: Sets, op: count }
          encoding: { as: xy, series: bar, x: week, y: [n], split: event }

  - id: worst
    title: Repositories by duplication
    grid: { x: 24, y: 10, w: 24, h: 10 }
    content:
      type: chart
      kind: table
      query: { language: kql, text: 'mimeo.kind : "repo"' }
      layers:
        - id: repos
          data_view: { index: mimeo-fleet, time_field: "@timestamp" }
          columns:
            - { id: repo, label: Repository, op: terms, fields: [repo.name], size: 50 }
            - { id: pct, label: Duplicated, op: last_value, field: repo.duplicatePercentage, sort_field: "@timestamp", format: { kind: number, decimals: 1, suffix: "%" } }
            - { id: dup, label: Duplicated lines, op: last_value, field: repo.duplicateLines, sort_field: "@timestamp" }
            - { id: cross, label: Shared with other repos, op: last_value, field: repo.crossRepoDuplicateLines, sort_field: "@timestamp" }
          encoding: { as: table, columns: [repo, pct, dup, cross] }
