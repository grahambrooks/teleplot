# Commit metrics from insight, for trunk-based work: on personal accounts and
# trunk-based teams most changes land as commits on main rather than pull
# requests, so commits are the main delivery signal.
#
# Every layer queries insight's series API (record type `change`, derived
# fields: kind, size_lines, day, weekday, hour, ai_assisted). Panels count
# people's commits unless they say otherwise; bots (dependabot, release
# automation, coding agents) are shown separately. git-notes history isn't
# counted. Times are UTC.
id: commits
title: Commits
description: Trunk-based delivery from commits on main, from insight
time:
  from: now-90d/d
  to: now
panels:
  - id: commits-by-repo
    title: Commits per week, by repository
    description: "Commits by people (not bots), by repository."
    grid: { x: 0, y: 0, w: 24, h: 10 }
    content:
      type: chart
      kind: xy
      layers:
        - id: commits
          data_view: { index: change, time_field: committed_at }
          insight:
            interval: 1w
            filters: [{ field: is_bot, op: eq, value: false }]
            group_by: [{ field: repo, size: 10 }]
            columns: [{ id: n, op: count }]
          columns:
            - { id: week, label: Week, op: value, field: t }
            - { id: repo, label: Repository, op: value, field: repo, shorten: true }
            - { id: n, label: Commits, op: value, field: n }
          encoding: { as: xy, series: bar_stacked, x: week, y: [n], split: repo, colors: stable }

  - id: active-days
    title: Commits per day
    description: "Commits by people each day: a steady rhythm shows as many lightly filled days rather than a few dark ones."
    grid: { x: 24, y: 0, w: 24, h: 10 }
    content:
      type: chart
      kind: calendar
      layers:
        - id: days
          data_view: { index: change, time_field: committed_at }
          insight:
            interval: 1d
            filters: [{ field: is_bot, op: eq, value: false }]
            columns: [{ id: n, op: count }]
          columns:
            - { id: day, label: Day, op: value, field: t }
            - { id: n, label: Commits, op: value, field: n }
          encoding: { as: calendar, date: day, value: n }

  - id: commit-size
    title: Commit size
    description: "Lines changed (added + deleted) per commit by people: each week's median inside its middle 50% (25th to 75th percentile). Small, frequent commits are the trunk-based ideal."
    grid: { x: 0, y: 10, w: 24, h: 10 }
    content:
      type: chart
      kind: xy
      layers:
        - id: size
          data_view: { index: change, time_field: committed_at }
          insight:
            interval: 1w
            filters: [{ field: is_bot, op: eq, value: false }]
            columns:
              - { id: p25, op: percentile, field: size_lines, p: 25 }
              - { id: p50, op: median, field: size_lines }
              - { id: p75, op: percentile, field: size_lines, p: 75 }
          columns:
            - { id: week, label: Week, op: value, field: t }
            - { id: p25, label: 25th percentile, op: value, field: p25, format: { kind: number, decimals: 0, suffix: " lines" } }
            - { id: p50, label: Median, op: value, field: p50, format: { kind: number, decimals: 0, suffix: " lines" } }
            - { id: p75, label: 75th percentile, op: value, field: p75, format: { kind: number, decimals: 0, suffix: " lines" } }
          encoding: { as: band, x: week, low: p25, mid: p50, high: p75 }

  - id: churn
    title: Lines added and deleted per week
    description: "All commits by people. Deletions alongside additions are a sign of refactoring rather than only growth."
    grid: { x: 24, y: 10, w: 24, h: 10 }
    content:
      type: chart
      kind: xy
      layers:
        - id: lines
          data_view: { index: change, time_field: committed_at }
          insight:
            interval: 1w
            filters: [{ field: is_bot, op: eq, value: false }]
            columns:
              - { id: added, op: sum, field: lines_added }
              - { id: deleted, op: sum, field: lines_deleted }
          columns:
            - { id: week, label: Week, op: value, field: t }
            - { id: added, label: Added, op: value, field: added }
            - { id: deleted, label: Deleted, op: value, field: deleted }
          encoding: { as: xy, series: bar, x: week, y: [added, deleted] }

  - id: work-mix
    title: What the commits were for
    description: "People's commits by conventional-commit type: the seven most common, the rest as Other types. `other (no type)` is a message without one. A proxy for where effort goes."
    grid: { x: 0, y: 20, w: 24, h: 10 }
    content:
      type: chart
      kind: xy
      layers:
        - id: kinds
          data_view: { index: change, time_field: committed_at }
          insight:
            interval: 1w
            filters: [{ field: is_bot, op: eq, value: false }]
            group_by: [{ field: kind, size: 7, order_by: n, rest: Other types }]
            columns: [{ id: n, op: count }]
          columns:
            - { id: week, label: Week, op: value, field: t }
            - { id: kind, label: Kind, op: value, field: kind }
            - { id: n, label: Commits, op: value, field: n }
          encoding: { as: xy, series: bar_percentage_stacked, x: week, y: [n], split: kind, series_styles: { other: { label: other (no type), color: neutral } } }

  - id: ai-assisted
    title: AI-assisted commits
    description: "Share of people's commits that git-ai attributes accepted AI-written lines to. Commits git-ai didn't record show as \"No git-ai record\": they may still have had help. git-ai sessions older than this range don't appear; the Code dashboard covers a year."
    grid: { x: 24, y: 20, w: 24, h: 10 }
    content:
      type: chart
      kind: xy
      layers:
        - id: ai
          data_view: { index: change, time_field: committed_at }
          insight:
            interval: 1w
            filters: [{ field: is_bot, op: eq, value: false }]
            group_by: [{ field: ai_assisted }]
            columns: [{ id: n, op: count }]
          columns:
            - { id: week, label: Week, op: value, field: t }
            - { id: ai, label: AI-assisted, op: value, field: ai_assisted }
            - { id: n, label: Commits, op: value, field: n }
          encoding: { as: xy, series: bar_percentage_stacked, x: week, y: [n], split: ai, series_styles: { "true": { label: AI-assisted, color: accent }, "false": { label: No git-ai record, color: neutral } } }

  - id: people-vs-bots
    title: Commits, people and automation
    description: "All commits, by whether a bot (dependabot, release automation, coding agents) made them."
    grid: { x: 0, y: 30, w: 24, h: 10 }
    content:
      type: chart
      kind: xy
      layers:
        - id: who
          data_view: { index: change, time_field: committed_at }
          insight:
            interval: 1w
            group_by: [{ field: is_bot }]
            columns: [{ id: n, op: count }]
          columns:
            - { id: week, label: Week, op: value, field: t }
            - { id: bot, label: By a bot, op: value, field: is_bot }
            - { id: n, label: Commits, op: value, field: n }
          encoding: { as: xy, series: bar_stacked, x: week, y: [n], split: bot, series_styles: { "false": { label: People, color: accent }, "true": { label: Automation, color: neutral } } }

  - id: large-commits
    title: Large commits per week
    description: "People's commits changing 500 lines or more: harder to review and to revert."
    grid: { x: 24, y: 30, w: 24, h: 10 }
    content:
      type: chart
      kind: xy
      layers:
        - id: large
          data_view: { index: change, time_field: committed_at }
          insight:
            interval: 1w
            filters:
              - { field: is_bot, op: eq, value: false }
              - { field: size_lines, op: range, gte: 500 }
            group_by: [{ field: repo, size: 10 }]
            columns: [{ id: n, op: count }]
          columns:
            - { id: week, label: Week, op: value, field: t }
            - { id: repo, label: Repository, op: value, field: repo, shorten: true }
            - { id: n, label: Large commits, op: value, field: n }
          encoding: { as: xy, series: bar_stacked, x: week, y: [n], split: repo, colors: stable }

  - id: when
    title: When people commit (UTC)
    description: "People's commits in the time range by weekday and hour, darker for more. Work outside a team's usual hours shows up here first."
    grid: { x: 0, y: 40, w: 48, h: 10 }
    content:
      type: chart
      kind: heatmap
      layers:
        - id: when
          data_view: { index: change, time_field: committed_at }
          insight:
            filters: [{ field: is_bot, op: eq, value: false }]
            group_by: [{ field: weekday }, { field: hour }]
            columns: [{ id: n, op: count }]
          columns:
            - { id: weekday, label: Weekday, op: value, field: weekday }
            - { id: hour, label: Hour, op: value, field: hour }
            - { id: n, label: Commits, op: value, field: n }
          encoding: { as: heatmap, x: hour, y: weekday, value: n }

  - id: by-repo
    title: Repositories
    description: "People's commits in the time range."
    grid: { x: 0, y: 50, w: 48, h: 9 }
    content:
      type: chart
      kind: table
      layers:
        - id: repos
          data_view: { index: change, time_field: committed_at }
          insight:
            filters: [{ field: is_bot, op: eq, value: false }]
            group_by: [{ field: repo, order_by: commits }, { field: team }]
            columns:
              - { id: commits, op: count }
              - { id: days, op: unique_count, field: day }
              - { id: size, op: median, field: size_lines }
              - { id: added, op: sum, field: lines_added }
              - { id: deleted, op: sum, field: lines_deleted }
          columns:
            - { id: repo, label: Repository, op: value, field: repo, shorten: true }
            - { id: team, label: Team, op: value, field: team }
            - { id: commits, label: Commits, op: value, field: commits }
            - { id: days, label: Active days, op: value, field: days }
            - { id: size, label: Median size, op: value, field: size, format: { kind: number, decimals: 0, suffix: " lines" } }
            - { id: added, label: Lines added, op: value, field: added }
            - { id: deleted, label: Lines deleted, op: value, field: deleted }
          encoding: { as: table, columns: [repo, team, commits, days, size, added, deleted] }
