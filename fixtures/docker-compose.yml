# Local Elasticsearch + Kibana stacks for manufacturing fixtures and running
# integration tests. Security is off: these are throwaway, localhost-only.
#
#   docker compose -f fixtures/docker-compose.yml --profile v8 up -d   # ES :9208, Kibana :5608
#   docker compose -f fixtures/docker-compose.yml --profile v9 up -d   # ES :9209, Kibana :5609

x-es: &es
  environment:
    - discovery.type=single-node
    - xpack.security.enabled=false
    - ES_JAVA_OPTS=-Xms1g -Xmx1g
  healthcheck:
    test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow"]
    interval: 5s
    retries: 60

x-kibana: &kibana
  healthcheck:
    test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
    interval: 5s
    retries: 120

services:
  es8:
    <<: *es
    profiles: [v8]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.22
    ports: ["127.0.0.1:9208:9200"]

  kibana8:
    <<: *kibana
    profiles: [v8]
    image: docker.elastic.co/kibana/kibana:8.19.22
    environment:
      - ELASTICSEARCH_HOSTS=http://es8:9200
    ports: ["127.0.0.1:5608:5601"]
    depends_on:
      es8: { condition: service_healthy }

  es9:
    <<: *es
    profiles: [v9]
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
    ports: ["127.0.0.1:9209:9200"]

  kibana9:
    <<: *kibana
    profiles: [v9]
    image: docker.elastic.co/kibana/kibana:9.5.3
    environment:
      - ELASTICSEARCH_HOSTS=http://es9:9200
    ports: ["127.0.0.1:5609:5601"]
    depends_on:
      es9: { condition: service_healthy }
